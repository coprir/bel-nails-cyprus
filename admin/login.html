<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | Bel Nails Cyprus</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%2317110f'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='30' font-weight='700' fill='%23d62e72' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin" data-page="login">

<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-card__brand">
      <span class="brand-mark">Bel <strong>N</strong>ails</span>
      <p>Administration</p>
    </div>
    <h1>Sign in to continue</h1>

    <div class="auth-error" id="authError"></div>

    <form id="loginForm">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username" autofocus>
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <div class="auth-row">
        <label><input type="checkbox" id="rememberMe" name="rememberMe"> Remember me</label>
        <a href="#" id="forgotLink">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn--primary" id="submitBtn">Sign In</button>
    </form>

    <p class="auth-footnote" id="forgotNote" hidden>
      There's no self-service password reset yet — ask the Master Admin to reset your password
      from Administrators &rarr; Reset Password.
    </p>
    <p class="auth-footnote">Bel Nails Cyprus &middot; Private administration area</p>
  </div>
</div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var errorBox = document.getElementById('authError');

  if (params.get('reason') === 'session_expired') {
    errorBox.textContent = 'Your session expired — please sign in again.';
    errorBox.classList.add('is-visible');
  }

  document.getElementById('forgotLink').addEventListener('click', function (e) {
    e.preventDefault();
    document.getElementById('forgotNote').hidden = false;
  });

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Signing In…';
    errorBox.classList.remove('is-visible');

    try {
      var res = await fetch('/api/auth/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          rememberMe: document.getElementById('rememberMe').checked,
        }),
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || 'Sign in failed.');

      if (data.user.mustChangePassword) {
        location.href = 'profile.html?forcePasswordChange=1';
      } else {
        location.href = 'dashboard.html';
      }
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('is-visible');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
})();
</script>
</body>
</html>
